name: CodeQL

# GitHub code scanning for C++ (security-and-quality query suite). Runs on
# PRs and pushes that touch code, plus weekly, and uploads SARIF results to
# the repo's Security tab.
on:
  push:
    branches: [main]
    paths:
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.hpp'
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'tests/**'
      - 'scenes/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.hpp'
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'tests/**'
      - 'scenes/**'
      - 'scripts/**'
  schedule:
    # Weekly full scan, Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # required to upload SARIF to code scanning

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL analyze (cpp security-and-quality)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build cmake git
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: cpp
          queries: security-and-quality
      # Manual build between init and analyze (documented CodeQL pattern):
      # the headless preset is known to work on the runner and exercises all
      # non-graphics translation units through FetchContent.
      - name: Configure
        run: cmake --preset headless
      - name: Build
        run: cmake --build --preset headless -j
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3

  analyze-graphics:
    # The headless preset does not compile the graphics TUs; this job builds
    # the full preset so window/renderer/editor code is analyzed too.
    name: CodeQL analyze graphics build (full preset)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain + graphics deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build cmake git \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libvulkan-dev glslang-tools libasound2-dev libpulse-dev
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: cpp
          queries: security-and-quality
      - name: Configure full preset (editor + Vulkan renderer + window)
        run: cmake --preset full
      - name: Build (full)
        run: cmake --build --preset full -j
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
