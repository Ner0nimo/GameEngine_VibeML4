name: CI

# Only run when something build-relevant changes. Doc/image-only commits
# (e.g. *.md) skip the runners entirely to save Actions minutes. Code,
# scenes/, scripts/, assets/, cmake/, and .github/workflows/ always trigger.
# Manual runs are possible via the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.webp'
      - '**/*.ico'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.webp'
      - '**/*.ico'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - 'LICENSE'
  workflow_dispatch:

# Cancel a superseded run on the same ref (e.g. rapid pushes to a PR branch)
# instead of paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  headless:
    name: Headless build + tests (no GPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build cmake git glslang-tools
      - name: Configure
        run: cmake --preset headless
      - name: Build
        run: cmake --build --preset headless -j
      - name: Test
        run: ctest --preset headless --output-on-failure
      - name: Graphics TU syntax check (window/renderer/editor compile under -Werror)
        run: scripts/syntax_check_graphics.sh
      - name: Runtime smoke test (feature scene, headless)
        run: |
          ./build/headless/runtime/ignis_runtime --headless --frames 300 \
            --commands scripts/commands.jsonl scenes/test_scene.scene.json > /dev/null
      - name: Export smoke test
        run: |
          ./build/headless/tools/exporter/ignis_export \
            --scene scenes/test_scene.scene.json --include scripts --include assets \
            --out build/dist
          ./build/headless/runtime/ignis_runtime --headless --frames 60 \
            --pak build/dist/game.ignispak > /dev/null

  full:
    name: Full build with editor + Vulkan (compile/link)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain + graphics deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build cmake git \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libvulkan-dev glslang-tools libasound2-dev libpulse-dev \
            mesa-vulkan-drivers
          # mesa-vulkan-drivers provides lavapipe (software Vulkan), so the
          # fork-guarded offscreen render tests actually execute in this job
          # instead of skipping; they still skip cleanly if the stack is broken.
      - name: Configure
        run: cmake --preset full
      - name: Build
        run: cmake --build --preset full -j
      - name: Test
        run: ctest --preset full --output-on-failure
